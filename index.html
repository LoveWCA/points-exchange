<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录测试</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="loginSection">
        <h3>队员登录</h3>
        <input type="text" id="accountInput" placeholder="账号">
        <input type="password" id="passwordInput" placeholder="密码">
        <button onclick="loginUser()">登录</button>
    </div>

    <div id="mainSection" style="display:none;">
        <h3>你好，<span id="userName"></span></h3>
        <p>你的积分：<span id="pointsDisplay"></span></p>
        <button onclick="logoutUser()">退出</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://hjktfecloctfpaoohzax.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqa3RmZWNsb2N0ZnBhb29oemF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQ5MzksImV4cCI6MjEwMjQ2MDkzOX0.Kd94mBz7-2EX9Xu3HZUKawIgUWCrVbFsH7rXFyz7WUg';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function loginUser() {
            const account = document.getElementById('accountInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!account || !password) { alert('请输入账号和密码'); return; }

            const { data, error } = await supabase.rpc('login_user', {
                p_account: account,
                p_password: password
            });

            if (error) {
                console.error('登录失败:', error);
                alert('账号或密码错误');
                return;
            }

            if (data && data.success) {
                currentUser = data;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';
                document.getElementById('userName').textContent = data.name;
                document.getElementById('pointsDisplay').textContent = data.points;
            } else {
                alert(data.msg || '账号或密码错误');
            }
        }

        function logoutUser() {
            currentUser = null;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mainSection').style.display = 'none';
        }
    </script>
</body>
</html>
